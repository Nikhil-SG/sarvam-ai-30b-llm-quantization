# =============================================================================
# Top-level Orchestrator Configuration
# =============================================================================
# This file controls how root main.py orchestrates the two pipelines.
# Pipeline-specific runtime settings stay in configs/research.yaml and configs/mxmoe.yaml.

orchestrator:
  default_pipeline: "all"          # research | mxmoe | all
  stop_on_error: true               # stop if one pipeline fails

  research:
    entrypoint: "pipelines.research.pipeline"
    config_path: "configs/research.yaml"
    modules: null                   # e.g. [1, 2, 3]
    quantizers: null                # e.g. ["int8", "fp8"]

  mxmoe:
    entrypoint: "pipelines.mxmoe.pipeline"
    config_path: "configs/mxmoe.yaml"
    modules: null                   # e.g. [1, 2]
